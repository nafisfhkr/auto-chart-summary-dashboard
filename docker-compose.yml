services:
  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: jatim_data
    ports:
      - "5433:5432"
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
      - ./docker/metabase-db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d jatim_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase-local:
    image: metabase/metabase:latest
    container_name: metabase-local
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
    volumes:
      - metabase_app_data:/metabase-data
    depends_on:
      metabase-db:
        condition: service_healthy

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      DATABASE_DRIVER_OVERRIDE: psycopg2
      PYTHONPATH: /opt/airflow/project
      LLM_BASE_URL: http://host.docker.internal:20128/v1
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
          test -n "$$AIRFLOW_ADMIN_PASSWORD" || { echo "AIRFLOW_ADMIN_PASSWORD is not set"; exit 1; }
          airflow db migrate
          airflow users create \
            --username admin \
            --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --firstname Airflow \
            --lastname Admin \
            --role Admin \
            --email admin@example.com

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      DATABASE_DRIVER_OVERRIDE: psycopg2
      PYTHONPATH: /opt/airflow/project
      LLM_BASE_URL: http://host.docker.internal:20128/v1
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      DATABASE_DRIVER_OVERRIDE: psycopg2
      PYTHONPATH: /opt/airflow/project
      LLM_BASE_URL: http://host.docker.internal:20128/v1
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  airflow_postgres_data:
  airflow_logs:
  metabase_db_data:
  metabase_app_data:
